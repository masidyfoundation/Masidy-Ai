services:
  - type: web
    name: masidy-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: ${RENDER_EXTERNAL_URL}/api
  
  - type: web
    name: masidy-backend
    runtime: python
    pythonVersion: 3.11
    startCommand: gunicorn -w 4 -b 0.0.0.0:8000 backend.app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: masidy-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_ENV
        value: production
    buildCommand: pip install -r backend/requirements.txt
    
  - type: web
    name: masidy-gateway
    runtime: node
    nodeVersion: 20
    startCommand: node dist/server.cjs
    envVars:
      - key: BACKEND_URL
        value: https://masidy-backend.onrender.com
      - key: NODE_ENV
        value: production
      - key: SERVER_PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: masidy-db
          property: connectionString

  - type: pserv
    name: masidy-db
    runtime: postgres
    plan: free
    ipAllowList: []
    envVars:
      - key: POSTGRES_DB
        value: masidy
      - key: POSTGRES_USER
        value: masidy_user
