services:
  - type: web
    name: masidy-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: ${RENDER_EXTERNAL_URL}/api
  
  - type: web
    name: masidy-backend
    runtime: python
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: masidy-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_ENV
        value: production
    buildCommand: pip install -r backend/requirements.txt
    
  - type: web
    name: masidy-gateway
    runtime: node
    startCommand: node dist/server.cjs
    envVars:
      - key: BACKEND_URL
        value: https://masidy-backend-za1t.onrender.com
      - key: NODE_ENV
        value: production
      - key: SERVER_PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: masidy-db
          property: connectionString
