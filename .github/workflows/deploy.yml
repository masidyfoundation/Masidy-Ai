name: Deploy to Render

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint TypeScript
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || exit 1
          test -f dist/server.cjs || exit 1
          echo "✅ Build artifacts verified"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render Deployment
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK not set in secrets"
            echo "To auto-deploy: Add RENDER_DEPLOY_HOOK to GitHub secrets"
          else
            curl --request POST \
              --url "${{ secrets.RENDER_DEPLOY_HOOK }}" \
              --header 'Content-Type: application/json'
            echo "✅ Deployment triggered on Render"
          fi
